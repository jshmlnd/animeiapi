services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info

  animeiapi:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
      FLARESOLVERR_TIMEOUT: "60000"
      # SOURCE_URL: "https://www.miruro.tv,https://www.miruro.ru"
    depends_on:
      - flaresolverr
