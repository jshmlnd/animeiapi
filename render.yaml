# Render Blueprint – animeiAPI (API-only, hybrid-ready)
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint → select repo.
# Streaming (/episodes,/watch) stays broken until you set FLARESOLVERR_URL to a
# residential FlareSolverr exposed via tunnel (see README Deployment section).
services:
  - type: web
    name: animeiapi
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLARESOLVERR_ALWAYS
        value: 0
      # Set these later in Render Dashboard → Environment when ready:
      # - key: FLARESOLVERR_URL
      #   sync: false
      # - key: FLARESOLVERR_TIMEOUT
      #   value: 60000
      # - key: SOURCE_URL
      #   sync: false
